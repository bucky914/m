<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Just Detail</title>
<meta name="description" content="Create your Just Detail account to enroll in a maintenance care plan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<div class="auth-page">
  <a href="index.html" class="auth-logo-link">
    <img src="https://res.cloudinary.com/dmr5kchzw/image/upload/v1786601006/Add_red_elements_to_image_202608131118_1_rtqnyl.png" alt="Just Detail" class="auth-logo">
  </a>

  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Set up your account to enroll in a care plan and track your visits.</p>

    <div id="authAlert" class="auth-alert" style="display:none;"></div>

    <form id="signupForm" class="auth-form" novalidate>
      <div class="form-row">
        <label for="suName">Full name</label>
        <input type="text" id="suName" required placeholder="Your name" autocomplete="name">
      </div>
      <div class="form-row">
        <label for="suPhone">Mobile number</label>
        <input type="tel" id="suPhone" required placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" autocomplete="tel">
      </div>
      <div class="form-row">
        <label for="suEmail">Email</label>
        <input type="email" id="suEmail" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-row">
        <label for="suPassword">Password</label>
        <input type="password" id="suPassword" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signupSubmit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  // If already logged in, skip signup entirely — go straight to the
  // dashboard, carrying along the plan they were trying to enroll in.
  (async () => {
    const user = await getCurrentUser();
    if (user) {
      const planId = getPlanIdFromUrl();
      window.location.href = planId ? `dashboard.html?enroll=${planId}` : 'dashboard.html';
    }
  })();

  function getPlanIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('plan');
  }

  function showAlert(message, type) {
    const el = document.getElementById('authAlert');
    el.textContent = message;
    el.className = 'auth-alert auth-alert-' + type;
    el.style.display = 'block';
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('signupSubmit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    const fullName = document.getElementById('suName').value.trim();
    const phone = document.getElementById('suPhone').value.trim();
    const email = document.getElementById('suEmail').value.trim();
    const password = document.getElementById('suPassword').value;

    const { user, error, needsConfirmation } = await signUpClient({ fullName, phone, email, password });

    if (error) {
      showAlert(error.message || 'Something went wrong creating your account.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
      return;
    }

    if (needsConfirmation) {
      showAlert('Check your email to confirm your account, then log in.', 'success');
      submitBtn.textContent = 'Check your email';
      return;
    }

    // Success — carry the plan selection into the dashboard's enrollment flow
    const planId = getPlanIdFromUrl();
    if (planId) {
      window.location.href = `dashboard.html?enroll=${planId}`;
    } else {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
